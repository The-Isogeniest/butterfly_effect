<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 700"
     width="800"
     height="700">

<style>
.w {
  fill: none;
  stroke: #1565C0;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.n {
  fill: #1565C0;
}
</style>

<!-- Left outer contour -->
<path class="w" d="
M400 400
L330 280
L150 120
L180 280
L300 300
L250 500
L180 620
L260 560
L320 520
L400 400"/>

<!-- Right outer contour -->
<path class="w" d="
M400 400
L470 280
L650 120
L620 280
L500 300
L550 500
L620 620
L540 560
L480 520
L400 400"/>

<!-- Upper left mesh -->
<line class="w" x1="150" y1="120" x2="250" y2="280"/>
<line class="w" x1="150" y1="120" x2="330" y2="280"/>
<line class="w" x1="180" y1="280" x2="330" y2="280"/>
<line class="w" x1="250" y1="280" x2="300" y2="300"/>
<line class="w" x1="180" y1="280" x2="300" y2="300"/>
<line class="w" x1="250" y1="280" x2="400" y2="400"/>
<line class="w" x1="300" y1="300" x2="400" y2="400"/>

<!-- Lower left mesh -->
<line class="w" x1="250" y1="500" x2="320" y2="520"/>
<line class="w" x1="250" y1="500" x2="180" y2="620"/>
<line class="w" x1="320" y1="520" x2="260" y2="560"/>
<line class="w" x1="250" y1="500" x2="400" y2="400"/>
<line class="w" x1="320" y1="520" x2="400" y2="400"/>

<!-- Upper right mesh -->
<line class="w" x1="650" y1="120" x2="550" y2="280"/>
<line class="w" x1="650" y1="120" x2="470" y2="280"/>
<line class="w" x1="620" y1="280" x2="470" y2="280"/>
<line class="w" x1="550" y1="280" x2="500" y2="300"/>
<line class="w" x1="620" y1="280" x2="500" y2="300"/>
<line class="w" x1="550" y1="280" x2="400" y2="400"/>
<line class="w" x1="500" y1="300" x2="400" y2="400"/>

<!-- Lower right mesh -->
<line class="w" x1="550" y1="500" x2="480" y2="520"/>
<line class="w" x1="550" y1="500" x2="620" y2="620"/>
<line class="w" x1="480" y1="520" x2="540" y2="560"/>
<line class="w" x1="550" y1="500" x2="400" y2="400"/>
<line class="w" x1="480" y1="520" x2="400" y2="400"/>

<!-- Central body -->
<line class="w" x1="400" y1="300" x2="400" y2="530"/>
<line class="w" x1="360" y1="250" x2="400" y2="300"/>
<line class="w" x1="440" y1="250" x2="400" y2="300"/>
<line class="w" x1="360" y1="250" x2="400" y2="400"/>
<line class="w" x1="440" y1="250" x2="400" y2="400"/>

<!-- Antennae -->
<line class="w" x1="370" y1="250" x2="340" y2="150"/>
<line class="w" x1="430" y1="250" x2="460" y2="150"/>

<circle class="n" cx="340" cy="150" r="6"/>
<circle class="n" cx="460" cy="150" r="6"/>

<!-- Research-style hub -->
<circle class="n" cx="400" cy="400" r="8"/>

</svg>

